<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Face Vibe Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #070913; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { font-size: 1.5rem; text-align: center; background: linear-gradient(90deg, #ff007f, #7f00ff, #00ffff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        p.subtitle { font-size: 0.75rem; text-align: center; color: #8a99ad; margin-bottom: 20px; max-width: 350px; }
        
        .scanner-container { width: 100%; max-width: 400px; background: #0e1326; border: 2px solid #00ffff55; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,255,255,0.15); margin-bottom: 20px; }
        
        video, canvas { width: 100%; height: 320px; object-fit: cover; display: block; background: #000; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        
        .hud-overlay { position: absolute; inset: 0; pointer-events: none; border: 1px dashed rgba(0,255,255,0.2); }
        .scanning-laser { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #00ffff; box-shadow: 0 0 10px #00ffff; animation: scan 2s infinite ease-in-out; opacity: 0; }
        .scanning-laser.active { opacity: 1; }
        @keyframes scan { 0%, 100% { top: 0%; } 50% { top: 100%; } }

        .btn-group { display: flex; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 15px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; transition: 0.2s; }
        #startBtn { background: linear-gradient(135deg, #ff007f, #7f00ff); color: #fff; box-shadow: 0 4px 15px rgba(255,0,127,0.4); }
        #soundBtn { background: #162038; color: #00ffff; border: 1px solid #00ffff44; flex: 0.4; }

        .result-card { width: 100%; max-width: 400px; background: #0e1326; border: 1px solid #ff007f44; border-radius: 16px; padding: 15px; display: none; }
        .result-card h3 { color: #ff007f; font-size: 1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; color: #b8c5d6; }
        .stat-bar { width: 100%; background: #1a233a; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 2px; }
        .stat-fill { height: 100%; background: linear-gradient(90deg, #ff007f, #00ffff); width: 0%; transition: width 1s ease-out; }
    </style>
</head>
<body>

    <h1>Cyber Face Scanner</h1>
    <p class="subtitle">AI Vibe & Aura Frequency Analyzer</p>

    <div class="scanner-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="hud-overlay">
            <div class="scanning-laser" id="laser"></div>
        </div>
    </div>

    <div class="btn-group">
        <button id="startBtn" onclick="startScanner()">⚡ Initialize Scanner</button>
        <button id="soundBtn" onclick="toggleSound()">🔊 Audio</button>
    </div>

    <div class="result-card" id="resultCard">
        <h3>Analysis Report <span id="vibeBadge" style="font-size:0.7rem; background:#ff007f33; padding:3px 8px; border-radius:6px; color:#ff007f;">AURA: NEON PINK</span></h3>
        <div class="stat-row"><span>Slay Factor</span><span id="stat1">0%</span></div>
        <div class="stat-bar"><div class="stat-fill" id="fill1"></div></div>
        <div class="stat-row" style="margin-top:8px;"><span>Charisma Index</span><span id="stat2">0%</span></div>
        <div class="stat-bar"><div class="stat-fill" id="fill2"></div></div>
        <div class="stat-row" style="margin-top:8px;"><span>Main Character Energy</span><span id="stat3">0%</span></div>
        <div class="stat-bar"><div class="stat-fill" id="fill3"></div></div>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('overlay');
        let ctx = canvas.getContext('2d');
        let laser = document.getElementById('laser');
        let resultCard = document.getElementById('resultCard');
        let soundEnabled = true;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundBtn').style.color = soundEnabled ? '#00ffff' : '#ff4444';
        }

        async function startScanner() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                
                document.getElementById('startBtn').innerText = "Scanning Subject...";
                document.getElementById('startBtn').style.opacity = "0.7";
                laser.classList.add('active');

                // Play beep if audio enabled
                if (soundEnabled) playBeep();

                // Run facial box targeting simulation
                setTimeout(showResults, 3000);
            } catch (err) {
                alert("Camera permission denied or not supported on this connection. Make sure you are on HTTPS.");
                console.error(err);
            }
        }

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function showResults() {
            laser.classList.remove('active');
            document.getElementById('startBtn').innerText = "Re-Scan Subject";
            document.getElementById('startBtn').style.opacity = "1";
            resultCard.style.display = "block";

            // Randomize fun stats
            let s1 = Math.floor(Math.random() * 25) + 75;
            let s2 = Math.floor(Math.random() * 20) + 80;
            let s3 = Math.floor(Math.random() * 15) + 85;

            document.getElementById('stat1').innerText = s1 + '%';
            document.getElementById('fill1').style.width = s1 + '%';
            document.getElementById('stat2').innerText = s2 + '%';
            document.getElementById('fill2').style.width = s2 + '%';
            document.getElementById('stat3').innerText = s3 + '%';
            document.getElementById('fill3').style.width = s3 + '%';

            // Draw targeting reticle on canvas
            canvas.width = video.videoWidth || 400;
            canvas.height = video.videoHeight || 320;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw sci-fi box around center face area
            let bx = canvas.width / 2 - 80;
            let by = canvas.height / 2 - 100;
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(bx, by, 160, 200);

            ctx.fillStyle = '#ff007f';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('TARGET LOCKED [100%]', bx, by - 10);
        }
    </script>
</body>
</html>
